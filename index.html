    const note = {weekly:"Weekly", biweekly:"Every 2 weeks", monthly:"Monthly"}[S.rep.freq] + (S.rep.months === "date" && S.rep.until ? " · ends " + serialToUS(S.rep.until) : "");
    return submitOp({type:"makerepeat", r: it.r, origText: it.text, text, amt, note, dates, cleared: it.cleared}, `Creating ${dates.length} bills`, "Repeating bills added");
  }
  if (f.id === "logForm") {
    const which = f.dataset.log;
    return submitOp({type:"editlog", tab: which === "spend" ? "Spending Log" : "Savings Log", r:+f.dataset.r, serial:isoToSerial($("#fDate").value), text:$("#fText").value.trim(), amt: which === "spend" ? Math.abs(amtRaw) : amtRaw}, "Saving");
  }
});

/* ---------- keyboard shortcuts (Magic Keyboard) ---------- */
// ⌘E expense · ⌘I income · ⌘B bill · ⌘S savings · Esc closes · ⌘Return saves the open form
const KEYMAP = {e:"expense", i:"income", b:"bill", s:"savings"};
document.addEventListener("keydown", e => {
  const k = (e.key || "").toLowerCase();
  if (e.key === "Escape" && document.body.classList.contains("drawer")) { e.preventDefault(); setDrawer(false); return; }
  if (e.key === "Escape" && !$("#sheet").hidden) { e.preventDefault(); closeSheet(); return; }
  if ((e.metaKey || e.ctrlKey) && k === "enter") {
    const f = $("#sheet:not([hidden]) form"); if (f) { e.preventDefault(); f.requestSubmit(); } return;
  }
  if ((e.metaKey || e.ctrlKey) && (k === "/" || k === "?")) { e.preventDefault(); keysSheet(); return; }
  if ((e.metaKey || e.ctrlKey) && /^[1-9]$/.test(k)) { const a = getAccounts()[+k - 1]; if (a) { e.preventDefault(); switchAccount(a.id); } return; }
  if (!(e.metaKey || e.ctrlKey) || e.altKey || e.shiftKey || !KEYMAP[k]) return;
  e.preventDefault(); e.stopPropagation();
  if (!S.month || !mcp) return;
  const amt = !$("#sheet").hidden && $("#addForm") && $("#fAmt") ? $("#fAmt").value : "";   // keep a typed amount when switching type
  lsSet("cf_lasttype", KEYMAP[k]); addSheet(KEYMAP[k]);
  if (amt) $("#fAmt").value = amt;
}, true);

function keysSheet(){
  const row = (k, d) => `<div class="krow"><span class="keys">${k.split(" ").map(x => `<kbd class="kk">${x}</kbd>`).join("")}</span><span>${d}</span></div>`;
  openSheet(`<h2>Keyboard shortcuts</h2>
    <div class="kgroup"><div class="kh">Add something</div>
      ${row("⌘ E", "New expense")}${row("⌘ I", "New income")}${row("⌘ B", "New bill")}${row("⌘ S", "Move money to savings")}</div>
    <div class="kgroup"><div class="kh">In the add form</div>
      ${row("Return", "Add it")}${row("⌘ Return", "Add it (works from any field)")}${row("Tab", "Next field")}${row("⌘ E", "Switch type (also ⌘I, ⌘B, ⌘S) and keep the amount")}${row("Esc", "Cancel and close")}</div>
    <div class="kgroup"><div class="kh">Calculator (iPad layout)</div>
      ${row("0–9 .", "Type numbers")}${row("+ - * /", "Add, subtract, multiply, divide")}${row("%", "Percent (100 − 25% = 75)")}${row("Return", "Equals — saves the line to the tape")}${row("Delete", "Erase the last character")}${row("Esc", "Clear")}${row("⌘ V", "Paste a number from the clipboard")}</div>
    <div class="kgroup"><div class="kh">Anywhere</div>
      ${row("⌘ /", "Show this list")}${row("⌘ 1 / 2", "Switch account")}${row("Esc", "Close any pop-up")}</div>
    <div class="kgroup"><div class="kh">Tips</div>
      <ul class="tips">
        <li>If a shortcut doesn't respond right after opening, tap once anywhere in the app first.</li>
        <li>The cursor starts in Amount — type the number, Tab to the description, Return to add. No mouse or touch needed.</li>
        <li>On iPad, hold down ⌘ to see the system's own shortcuts. If one of these doesn't respond, iPadOS is probably using it for something else.</li>
        <li>The shortcut letters also show on the type buttons in the add form when you're on a wide screen.</li>
      </ul></div>
    <div class="btns"><button type="button" class="btn" data-close>Close</button></div>`);
}

/* ---------- calculator with tape ---------- */
const C = { expr: "", last: null };   // expr is a token string like "12+7×2"
function loadTape(){ try { return JSON.parse(lsGet("cf_tape") || "[]"); } catch(e){ return []; } }
let TAPE = loadTape();
const OPS = "+−×÷";
function calcEval(expr){
  // tokenize, apply % as /100 to the number before it, then × ÷ before + −
  const toks = []; let num = "";
  for (const ch of expr) {
    if ("0123456789.".includes(ch)) num += ch;
    else if (ch === "%") { if (num) { toks.push({pct: parseFloat(num)}); num = "pct"; } }
    else if (OPS.includes(ch)) { if (num === "" && (ch === "−") && (!toks.length || OPS.includes(toks[toks.length-1]))) { num = "-"; continue; } if (num !== "" && num !== "pct") toks.push(parseFloat(num)); num = ""; toks.push(ch); }
  }
  if (num !== "" && num !== "-" && num !== "pct") toks.push(parseFloat(num));
  while (toks.length && OPS.includes(toks[toks.length-1])) toks.pop();
  if (!toks.length) return null;
  // percent works like the iPhone calculator: 100 − 25% = 75 (25% of 100), 80 × 10% = 8
  const val = t => typeof t === "object" ? t.pct / 100 : t;
  const st = [val(toks[0])];
  for (let i = 1; i < toks.length; i += 2) {
    const op = toks[i], raw = toks[i+1];
    if (raw === undefined) break;
    let v = val(raw);
    if (typeof raw === "object" && (op === "+" || op === "−")) v = st.reduce((a, b) => a + b, 0) * raw.pct / 100;
    if (isNaN(v)) break;
    if (op === "×") st[st.length-1] *= v;
    else if (op === "÷") st[st.length-1] = v === 0 ? NaN : st[st.length-1] / v;
    else st.push(op === "+" ? v : -v);
  }
  const r = st.reduce((a, b) => a + b, 0);
  return isFinite(r) ? Math.round(r * 1e8) / 1e8 : NaN;
}
const fmtNum = n => n == null ? "0" : isNaN(n) ? "Error" : n.toLocaleString("en-US", {maximumFractionDigits: 8});
const prettyExpr = e => e.replace(/([+−×÷])/g, " $1 ");
function calcPress(k){
  if (C.done && (/^\d$/.test(k) || k === ".")) C.expr = "";
  C.done = false;
  const lastCh = C.expr.slice(-1);
  if (k === "C") { C.expr = ""; C.last = null; }
  else if (k === "⌫") { C.expr = C.expr.slice(0, -1); }
  else if (k === "=") {
    const r = calcEval(C.expr);
    if (r != null && C.expr && /[+−×÷%]/.test(C.expr.replace(/^−/, ""))) {
      TAPE.unshift({e: C.expr, r, t: Date.now()}); TAPE = TAPE.slice(0, 60); lsSet("cf_tape", JSON.stringify(TAPE));
    }
    C.lastExpr = C.expr; C.last = r; C.expr = r == null || isNaN(r) ? "" : String(r).replace("-", "−"); C.done = true; renderCalc(); return;
  }
  else if (OPS.includes(k)) {
    if (!C.expr && k !== "−") C.expr = C.last != null && !isNaN(C.last) ? String(C.last).replace("-", "−") : "0";
    if (OPS.includes(lastCh)) C.expr = C.expr.slice(0, -1);
    C.expr += k;
  }
  else if (k === "±") {
    const m = C.expr.match(/(−?)([\d.]+%?)$/);
    if (m) { const start = C.expr.length - m[0].length; const before = C.expr.slice(0, start);
      const unary = m[1] && (start === 0 || OPS.includes(before.slice(-1)));
      C.expr = unary ? before + m[2] : before + (m[1] ? m[0] : "−" + m[2]); }
  }
  else if (k === "%") { if (/[\d]$/.test(C.expr)) C.expr += "%"; }
  else if (k === ".") { const m = C.expr.match(/[\d.]*$/)[0]; if (!m.includes(".")) C.expr += (m ? "." : "0."); }
  else if (/^\d$/.test(k)) { if (lastCh === "%") C.expr += "×"; C.expr += k; }
  renderCalc();
}
function calcValue(){ const r = calcEval(C.expr); return r == null ? (C.last ?? 0) : r; }
function renderCalc(){
  const el = $("#calc"); if (!el) return;
  const live = calcEval(C.expr);
  const shown = C.expr ? (live == null ? 0 : live) : (C.last ?? 0);
  el.innerHTML = `<div class="card calc">
    <div class="cdisp"><div class="cclip"><button id="calcCopy">⧉ Copy</button><button id="calcPaste">📋 Paste</button></div>
      <div class="cpaste" id="cpasteBox" hidden><input id="cpasteIn" inputmode="decimal" placeholder="Press and hold here, then tap Paste" autocomplete="off"><button id="cpasteX" aria-label="Cancel">✕</button></div>
      <div class="cexpr">${C.done && C.lastExpr ? esc(prettyExpr(C.lastExpr)) + " =" : (esc(prettyExpr(C.expr)) || "&nbsp;")}</div><div class="cval">${fmtNum(shown)}</div></div>
    <div class="ckeys">
      ${["C","±","%","÷","7","8","9","×","4","5","6","−","1","2","3","+"].map(k => `<button data-ck="${k}" class="${OPS.includes(k) ? "op" : ["C","±","%"].includes(k) ? "fn" : ""}">${k}</button>`).join("")}
      <button data-ck="0" class="zero">0</button><button data-ck=".">.</button><button data-ck="=" class="eq">=</button>
    </div>
    <div class="cact"><button data-cuse="expense">→ Expense</button><button data-cuse="bill">→ Bill</button><button data-cuse="income">→ Income</button><button data-ck="⌫">⌫</button></div>
    <div class="tape"><div class="tapehead"><span>Tape</span>${TAPE.length ? `<button id="tapeClear">Clear tape</button>` : ""}</div>
      <div class="tapelist">${TAPE.length ? TAPE.map((t, i) => `<button class="tline" data-tape="${i}"><span>${esc(prettyExpr(t.e))} =</span><b>${fmtNum(t.r)}</b></button>`).join("") : `<div class="tempty">Calculations you finish with = show up here. Tap one to use its answer again.</div>`}</div></div>
  </div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.ck) { calcPress(b.dataset.ck); return; }
  if (b.dataset.tape != null) { const t = TAPE[+b.dataset.tape]; if (t) { C.expr = String(t.r).replace("-", "−"); C.last = t.r; C.done = true; renderCalc(); } return; }
  if (b.id === "tapeClear") { if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Tap again to clear"; return; } TAPE = []; lsSet("cf_tape", "[]"); renderCalc(); return; }
  if (b.dataset.cuse) {
    const v = Math.abs(calcValue()); if (!S.month || !v || isNaN(v)) { toast("Nothing to add yet"); return; }
    addSheet(b.dataset.cuse); const a = $("#fAmt"); if (a) a.value = v.toFixed(2);
  }
});
// Magic Keyboard: digits and operators go to the calculator when no form is open and nothing is being typed into
const calcVisible = () => { const el = $("#calc"); return el && el.offsetParent !== null; };
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || !calcVisible() || !$("#sheet").hidden) return;
  const ae = document.activeElement; if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.isContentEditable)) return;
  const map = {"+":"+","-":"−","*":"×","x":"×","X":"×","/":"÷","Enter":"=","=":"=","Backspace":"⌫","Escape":"C","c":"C","C":"C","%":"%",".":".",",":"."};
  const k = /^\d$/.test(e.key) ? e.key : map[e.key];
  if (!k) return;
  e.preventDefault(); calcPress(k);
});

/* calculator copy / paste */
function pasteNumber(text){
  const m = String(text || "").replace(/[$,\s]/g, "").match(/-?\d*\.?\d+/);
  if (!m) { toast("No number found to paste"); return false; }
  const n = m[0].replace("-", "−"), lastCh = C.expr.slice(-1);
  if (C.done || !C.expr) C.expr = n;
  else if (OPS.includes(lastCh)) C.expr += n;                                     // after an operator: append
  else C.expr = C.expr.replace(/−?[\d.]+%?$/, "") + n;                          // replace the number being typed
  C.done = false; renderCalc(); toast(`Pasted ${m[0]}`); return true;
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch(e) {}
  try { const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok; } catch(e) { return false; }
}
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "calcCopy") {
    const v = calcValue(); const t = isNaN(v) ? "" : String(Math.round(v * 100) / 100 === v ? v : Math.round(v * 1e8) / 1e8);
    toast(t && await copyText(t) ? `Copied ${t}` : "Couldn't copy — try selecting the number instead", 2500); return;
  }
  if (b.id === "calcPaste") {
    try { const t = await navigator.clipboard.readText(); if (t && pasteNumber(t)) return; } catch(err) {}   // usually blocked here; fall back to the paste box
    const box = $("#cpasteBox"); box.hidden = false; const i = $("#cpasteIn"); i.value = ""; i.focus(); return;
  }
  if (b.id === "cpasteX") { $("#cpasteBox").hidden = true; return; }
});
document.addEventListener("input", e => {
  if (e.target.id !== "cpasteIn") return;
  const v = e.target.value; if (!v) return;
  if (pasteNumber(v)) { /* renderCalc rebuilt the box, so it closes itself */ }
});
// ⌘V anywhere (outside a text field) pastes into the calculator on the iPad layout
document.addEventListener("paste", e => {
  if (!calcVisible() || !$("#sheet").hidden) return;
  const ae = document.activeElement; if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA") && ae.id !== "cpasteIn") return;
  const t = e.clipboardData && e.clipboardData.getData("text"); if (!t) return;
  e.preventDefault(); pasteNumber(t);
});

/* ---------- iPhone: balance card stays put while the timeline scrolls ---------- */
const isPhone = () => window.innerWidth < 900;
function fitTimeline(){
  const tl = $("#tl"), on = isPhone() && !!tl, pad = !isPhone() && !!tl;
  document.body.classList.toggle("tlfix", on);
  document.body.classList.toggle("tlfixpad", pad);
  // iPad: the left column (balance, calculator, Bills calendar) fills exactly to the bottom of the screen
  const lc0 = $("#leftcol");
  if (lc0 && !isPhone() && matchMedia("(min-width: 900px)").matches) { if (window.scrollY) window.scrollTo(0, 0); lc0.style.height = Math.max(420, window.innerHeight - lc0.getBoundingClientRect().top - 14) + "px"; }
  else if (lc0) lc0.style.height = "";
  if (!tl) return;
  if (pad) {   // iPad: timeline ends at the same spot as the calculator column on the left
    if (window.scrollY) window.scrollTo(0, 0);
    const lc = $("#leftcol"), bottom = lc ? lc.getBoundingClientRect().bottom : window.innerHeight - 20;
    tl.style.height = Math.max(300, bottom - tl.getBoundingClientRect().top) + "px";
    return;
  }
  if (!on) { tl.style.height = ""; return; }
  if (window.scrollY) window.scrollTo(0, 0);
  const floor = window.innerHeight - 6;   // nothing sits under the timeline on iPhone; it runs to the bottom
  tl.style.height = Math.max(260, floor - tl.getBoundingClientRect().top) + "px";
}
window.addEventListener("resize", () => fitTimeline());
if (window.visualViewport) visualViewport.addEventListener("resize", () => fitTimeline());
// v40: refit when the balance area above the timeline changes height (e.g. the "Updated" line wraps)
if (window.ResizeObserver && $("#leftcol")) { let rh = 0; new ResizeObserver(() => { const h = $("#leftcol").offsetHeight; if (isPhone() && h !== rh) { rh = h; fitTimeline(); } }).observe($("#leftcol")); }

/* ---------- iPhone: views menu slides over from the left (button top-left, or swipe in from the left edge) ---------- */
function renderDrawerAccts(){
  const box = $("#dAccts"); if (!box) return;
  box.innerHTML = getAccounts().map(a => `<button class="dacct" data-acct="${esc(a.id)}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/></svg><span>${esc(a.name)}</span>${a.id === S.id ? "<small>✓ Showing</small>" : ""}</button>`).join("");
}
function setDrawer(open){
  if (!isPhone()) open = false;
  if (open) renderDrawerAccts();
  document.body.classList.toggle("drawer", open);
  $("#dscrim").hidden = !open;
  const hm = $("#hMenu"); if (hm) hm.setAttribute("aria-expanded", open ? "true" : "false");
  if (open) { const on = document.querySelector("#tabs button.on") || document.querySelector("#tabs button"); if (on) on.focus({preventScroll:true}); }
}
(() => {
  let x0 = null, y0 = 0, from = "";
  document.addEventListener("touchstart", e => {
    if (!isPhone() || !$("#sheet").hidden) return;
    const t = e.touches[0], open = document.body.classList.contains("drawer");
    if (!open && t.clientX < 22) { x0 = t.clientX; y0 = t.clientY; from = "edge"; }
    else if (open) { x0 = t.clientX; y0 = t.clientY; from = "panel"; }
    else x0 = null;
  }, {passive:true});
  document.addEventListener("touchmove", e => {
    if (x0 === null) return;
    const t = e.touches[0], dx = t.clientX - x0, dy = Math.abs(t.clientY - y0);
    if (dy > 40 && dy > Math.abs(dx)) { x0 = null; return; }
    if (from === "edge" && dx > 50) { setDrawer(true); x0 = null; }
    else if (from === "panel" && dx < -50) { setDrawer(false); x0 = null; }
  }, {passive:true});
  document.addEventListener("touchend", () => { x0 = null; }, {passive:true});
  window.addEventListener("resize", () => { if (!isPhone()) setDrawer(false); });
})();

/* ---------- back to top ---------- */
document.addEventListener("click", e => { if (e.target.closest("h1") && !e.target.closest("#btnAcct")) window.scrollTo({top:0, behavior:"smooth"}); });

/* ---------- boot ---------- */
renderAcct();
render();
(async () => {
  mcp = CFG.url && CFG.key ? {} : null;
  if (!mcp) { S.loading = false; render(); return; }
  startLive();
})();
async function startLive(){
  await loadAll();
  flushQueue();
  // live updates: re-read the sheet every minute while visible, and when coming back to the app
  const quiet = () => mcp && !S.busy && !S.loading && !S.refreshing && $("#sheet").hidden && document.visibilityState === "visible" && navigator.onLine;
  setInterval(() => { if (!quiet()) return; if (S.queue.length) flushQueue(); else loadAll(null, true); }, 60000);
  document.addEventListener("visibilitychange", () => { if (quiet() && (!S.loadedAt || Date.now() - S.loadedAt > 20000)) { S.queue.length ? flushQueue() : loadAll(); } });
  window.addEventListener("online", () => { S.offline = false; renderQueue(); setTimeout(() => { flushQueue(); if (!S.queue.length) loadAll(); }, 1500); });
  window.addEventListener("offline", () => { S.offline = true; render(); });
}
// offline support: keep the app itself saved on the device
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).then(reg => {
    reg.update().catch(() => {});
    // also look for a new version whenever the app comes back to the screen
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && navigator.onLine) reg.update().catch(() => {}); });
  }).catch(() => {}));
  // a new version just took over: reload once so it shows right away (not if a form is open)
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloaded) return;
    reloaded = true;
    const go = () => location.reload();
    if ($("#sheet").hidden) { toast("Updating to the newest version…", 0); setTimeout(go, 600); }
    else toast("A new version is ready — it loads next time you open the app", 4000);
  });
}
</script>
