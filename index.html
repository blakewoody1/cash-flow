<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#121513">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cash Flow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=5">
<link rel="icon" type="image/png" href="icon-192.png?v=5">
<title>Cash Flow</title>
<style>
:root{
  --bg:#f3f1ec; --card:#ffffff; --ink:#1d2320; --muted:#6c736f; --line:#e4e1da;
  --accent:#1f6f50; --accent-ink:#ffffff; --accent-soft:#e2efe8;
  --inc:#1f7a4d; --bill:#b4432f; --save:#2f5fa8; --spend:#9a6a12;
  --warn:#b4432f; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121513;--card:#1c201e;--ink:#eef1ef;--muted:#9aa39e;--line:#2b302d;
    --accent:#45b886;--accent-ink:#0d1a13;--accent-soft:#1e3329;
    --inc:#5fcf95;--bill:#ef8a74;--save:#86aef0;--spend:#e2b45a;--warn:#ef8a74;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 110px)}
.toprow{display:flex;align-items:center;justify-content:space-between;}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.icon{display:grid;place-items:center;font-size:20px;}

.card{background:var(--card);box-shadow:var(--shadow);}
.hero{padding:18px 18px 14px}
.hero .lbl{color:var(--muted);font-size:14px}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);color:var(--accent);padding:6px 10px;border-radius:10px;font-size:14px;font-weight:600}
.pill.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.statbtn{text-align:left;border:1.5px solid var(--accent);background:var(--accent-soft)}
.statbtn:active{transform:scale(.97)}
.safeval{color:var(--accent)}
.stat{background:var(--bg);border-radius:12px;}
.stat{padding:9px 7px!important;min-width:0}
.stat{display:flex;flex-direction:column;justify-content:space-between;gap:3px}
.stat small{display:block;color:var(--muted);font-size:11px;line-height:1.15}
.stat b{display:block;font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.totals{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px;font-size:13px;color:var(--muted)}
.totals b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--line);padding:3px;border-radius:12px;margin:16px 0 10px}
.seg button{flex:1;padding:9px 0;border-radius:10px;font-size:12.5px;letter-spacing:-.01em;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.day{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px 6px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day .bal{font-weight:600;text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.group{overflow:hidden}
.past{opacity:.55}
.item{display:flex;width:100%;align-items:center;gap:12px;padding:12px 14px;text-align:left;border-top:1px solid var(--line);min-height:56px}
.item:first-child{border-top:0}
.item:active{background:var(--bg)}
.pending{opacity:.75;border-left:3px solid var(--spend)}
.pending .sub{color:var(--spend)}
.cbadge{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;font-size:10px;font-weight:800;margin-left:7px;vertical-align:2px}
.cstat{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 4px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:14px;color:var(--muted)}
.cstat b{color:var(--ink)}
.cstat.on{background:var(--accent-soft)}
.cstat.on b{color:var(--accent)}
.cstatbtn{flex:none;padding:8px 12px;border-radius:10px;font-weight:700;font-size:14px;background:var(--accent);color:var(--accent-ink)}
.cstat.on .cstatbtn{background:var(--card);color:var(--muted);border:1px solid var(--line)}
.amt b.pos{color:var(--inc)}
.clrline{margin-top:10px;font-size:13px;color:var(--muted)}
.clrline b{color:var(--ink);font-variant-numeric:tabular-nums}
.clrsub{display:block;font-size:12px;margin-top:1px}
.dot{flex:none;}

.mid{flex:1;min-width:0}
.desc{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{text-align:right;font-variant-numeric:tabular-nums}
.amt b{display:block;font-weight:650}
.amt small{display:block;font-size:12px;color:var(--muted)}
.k-income .amt b{color:var(--inc)}
.neg{color:var(--warn)!important}
.today{display:flex;align-items:center;gap:8px;margin:14px 2px 2px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.today::after{content:"";flex:1;height:2px;border-radius:2px;opacity:.5}
.fab{position:fixed;font-size:34px;font-weight:300;display:grid;place-items:center;z-index:5}
.fab:active{transform:scale(.96)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);z-index:11;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:calc(100dvh - env(safe-area-inset-top) - 28px);overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.2);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:19px;margin:0 0 12px}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field input,.field select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:17px;outline:none;-webkit-appearance:none;appearance:none;min-height:50px}
.field input:focus{border-color:var(--accent)}
.money-in{font-size:32px!important;font-weight:700;font-variant-numeric:tabular-nums;padding:10px 14px!important}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{padding:7px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.typeseg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.typeseg button{padding:10px 0;border-radius:12px;background:var(--bg);font-weight:600;font-size:14px;border:2px solid transparent}
.typeseg button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.radio{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--bg);margin-top:6px;font-size:15px}
.radio input{margin-top:3px;accent-color:var(--accent);width:18px;height:18px}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:15px;border-radius:14px;font-weight:700;font-size:17px;background:var(--bg)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--warn)}
.btn.danger.armed{background:var(--warn);color:#fff}
.btn:disabled{opacity:.5}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;font-size:14px;font-weight:600;z-index:20;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.notice{padding:18px;margin-top:12px}
.notice h3{margin:0 0 6px;font-size:17px}
.notice p{margin:0;color:var(--muted);font-size:15px}
.notice .btn{margin-top:14px}
.skel{height:14px;border-radius:7px;background:var(--line);margin:10px 0;animation:pulse 1.2s infinite ease-in-out}
@keyframes pulse{50%{opacity:.5}}
.empty{padding:22px;text-align:center;color:var(--muted)}
.seg-sm{display:flex;gap:6px;margin-top:6px}
.seg-sm button{flex:1;padding:10px;border-radius:12px;background:var(--bg);font-weight:600;font-size:14px;border:2px solid transparent}
.seg-sm button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{padding:12px 13px}
.ph b{display:block;font-size:14px}
.ph small{display:block;font-size:12px;color:var(--muted)}
.pnow{font-size:22px;font-weight:700;margin:6px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pmeta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:2px;background:var(--line);margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.pflow{display:flex;flex-direction:column;font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.pin{color:var(--inc)}
.safe{grid-column:1/-1;border:1.5px solid var(--accent);background:linear-gradient(var(--accent-soft),var(--card) 70%)}
.safe .pnow{font-size:30px;color:var(--accent)}
.safe .pnow.neg{color:var(--warn)}
.est{margin:10px 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted);line-height:1.4}
.qbox{padding:12px 14px;margin-bottom:12px;border:1.5px solid var(--spend);background:color-mix(in srgb,var(--spend) 8%,var(--card))}
.qhead{display:flex;justify-content:space-between;align-items:center}
.qsync{background:var(--accent);color:var(--accent-ink);padding:7px 12px;border-radius:10px;font-weight:700;font-size:14px}
.qitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;margin-top:6px}
.qitem small{display:block;font-size:12px}
.qx{color:var(--muted);padding:6px 8px;border-radius:8px;font-size:13px;flex:none}
.qx.armed{background:var(--warn);color:#fff}
.wide{grid-column:1/-1}
.unit{font-size:15px;font-weight:600;color:var(--muted)}
.lrow{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.lrow small{color:var(--muted)}
.bar.thin{height:3px;margin:0 0 4px}
.wk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px;text-align:center}
.wkb{position:relative;height:90px;background:var(--bg);border-radius:8px;overflow:hidden}
.wkb i{position:absolute;left:0;right:0;bottom:0;background:var(--spend);border-radius:6px 6px 0 0}
.wkb s{position:absolute;left:0;right:0;border-top:2px dashed var(--accent)}
.wkc b{display:block;font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}
.wkc small{font-size:11px;color:var(--muted)}
.tlwrap{position:relative}
.tl{height:min(74vh,700px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:auto;position:relative;border-radius:var(--r);padding:0 2px;
  mask-image:linear-gradient(transparent 0,#000 14px,#000 calc(100% - 18px),transparent);-webkit-mask-image:linear-gradient(transparent 0,#000 14px,#000 calc(100% - 18px),transparent)}
.tl .day{position:sticky;top:0;z-index:1;background:var(--bg)}

.jump{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:2}
h1{cursor:pointer}
kbd{display:none;font:600 11px -apple-system,sans-serif;color:var(--muted);margin-left:5px}
@media (min-width: 700px){ kbd{display:inline} }
.kbdhint{display:none}
@media (min-width: 700px){ .kbdhint{display:block} }
.kbbtn{margin-top:10px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:17px}
.kbbtn:active{transform:scale(.95)}
.kgroup{margin:14px 0}
.kh{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.krow{display:flex;align-items:center;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.keys{flex:none;min-width:118px;display:flex;gap:4px}
.kk{display:inline-block;font:600 13px -apple-system,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:3px 7px;margin:0}
.tips{margin:4px 0 0;padding-left:18px;font-size:14px;color:var(--muted);line-height:1.45}
.tips li{margin:4px 0}
/* centered top card */
.hero{text-align:center}

.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.hero .clrline{text-align:center}
.hero .stat{align-items:center;text-align:center}
.hero .statbtn{text-align:center}
.hero .totals{display:block;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tgrid span{display:flex;flex-direction:column;align-items:center;gap:1px}
.tgrid small{font-size:11px;color:var(--muted)}
.tgrid b{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
/* ---------- calculator (iPad / wide only) ---------- */
#calc{display:none;margin-top:14px}
.warnc{color:var(--warn)}
button.statcard{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.affrow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 2px;border:0;border-top:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.affrow:first-of-type{border-top:0}
.affn{flex:none;width:24px;height:24px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.afft{flex:1;min-width:0;display:flex;flex-direction:column}.afft small,.affr small{color:var(--muted);font-size:12px}
.affr{flex:none;display:flex;flex-direction:column;align-items:flex-end}
#calbox{display:none}
.calcard{padding:10px 12px;display:flex;flex-direction:column;min-height:0;height:100%}
.calhead{display:flex;align-items:center;gap:6px}.calhead b{flex:1;text-align:center;font-size:15px}
.calnav,.caladd{border:0;background:var(--bg);color:var(--text);width:30px;height:30px;border-radius:15px;font-size:18px;line-height:1;cursor:pointer}
.caladd{color:var(--accent);font-weight:700}
.calsub{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 6px}
.callist{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}.callist::-webkit-scrollbar{display:none}
.calday{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line)}.calday:first-child{border-top:0}
.calday.past{opacity:.55}.calday.today .cald{color:var(--accent);font-weight:700}
.cald{flex:none;width:46px;font-size:12px;color:var(--muted);padding-top:3px}
.calday>div{flex:1;min-width:0}
.calev{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;background:none;font:inherit;font-size:13px;color:inherit;padding:3px 0;text-align:left;cursor:pointer}
.calev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.titlein{width:100%;font-family:inherit;font-weight:700;font-size:24px;line-height:1.2;border:0;border-bottom:1.5px solid var(--line);background:transparent;color:var(--text);padding:6px 0 8px;margin:4px 0 6px;border-radius:0}
.titlein:focus{outline:none;border-bottom-color:var(--accent)}
.calc{padding:14px}
.cdisp{background:var(--bg);border-radius:12px;padding:10px 14px;text-align:right;margin-bottom:10px}
.cclip{display:flex;gap:6px;justify-content:flex-start;margin:-2px 0 4px}
.cclip button{font-size:12px;font-weight:700;color:var(--accent);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 9px}
.cpaste{display:flex;gap:6px;margin:4px 0}
.cpaste[hidden]{display:none}
.cpaste input{flex:1;min-width:0;padding:8px 10px;border-radius:9px;border:1.5px solid var(--accent);background:var(--card);font-size:15px;outline:none}
.cpaste button{color:var(--muted);padding:0 8px}
.cexpr{font-size:14px;color:var(--muted);min-height:18px;word-break:break-all;font-variant-numeric:tabular-nums}
.cval{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ckeys button{padding:9px 0;border-radius:11px;background:var(--bg);font-size:19px;font-weight:600}
.ckeys button:active{transform:scale(.96);filter:brightness(.95)}

.ckeys .eq{background:var(--accent);color:var(--accent-ink)}
.ckeys .fn{color:var(--muted);font-size:17px}
.ckeys .zero{grid-column:span 2}
.cact{display:flex;gap:7px;margin-top:9px}
.cact button{flex:1;padding:9px 6px;border-radius:10px;background:var(--bg);font-size:13px;font-weight:700;color:var(--accent)}
.tape{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.tapehead{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tapehead button{font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;padding:4px 6px}
.tapelist{max-height:260px;overflow-y:auto;margin-top:4px;font-family:ui-monospace,"SF Mono",Menlo,monospace}
.tline{border-bottom:1px solid var(--line);text-align:left}
.tline span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tline b{font-variant-numeric:tabular-nums;white-space:nowrap}

.tempty{font-size:13px;color:var(--muted);padding:8px 0;font-family:-apple-system,sans-serif}

.shead{position:sticky;top:-10px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);
  margin:-4px -18px 8px;padding:8px 18px 10px;border-bottom:1px solid var(--line)}
.shead b{font-size:16px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{padding:8px 6px;font-size:17px;color:var(--muted);font-weight:500;min-width:64px;text-align:left}
.hbtn.primary{color:var(--accent);font-weight:800;text-align:right}
/* Cancel / Save at the top of every sheet: big, easy-to-hit buttons */
.shead .hbtn{min-height:44px;min-width:84px;padding:10px 16px;border-radius:22px;text-align:center;background:var(--chip);color:var(--text)}
.shead .hbtn.primary{background:var(--accent);color:var(--card)}
.shead .hbtn:active{opacity:.7}
:root{--sat:env(safe-area-inset-top,0px)}
.radio small.hint{margin:0;font-size:12.5px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choice{text-align:left;padding:13px 14px;border-radius:14px;background:var(--bg);border:1.5px solid var(--line)}
.choice b{display:block;font-size:16px}
.choice small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.choice:first-child{border-color:var(--accent);background:var(--accent-soft)}
.choice:active{transform:scale(.99)}
.repeatbtn{width:100%;margin:2px 0 4px;color:var(--accent);font-size:15px;padding:11px}
.bankbtn{color:var(--ink);white-space:nowrap}
.bankbtn:active{transform:scale(.96)}
.acctbtn{font:inherit;font-weight:700;color:inherit;display:inline-flex;align-items:center;gap:6px;}

.acctrow{display:flex;gap:6px;margin-top:6px}
.acctrow .aName{flex:0 0 32%}

  --accent:#1d6b4c; --accent-ink:#ffffff; --accent-soft:#dcefe5; --inc:#14704a;

  --glass-shadow:0 10px 30px rgba(18,28,23,.16),0 1px 3px rgba(18,28,23,.10);

}

<script>
const DEFAULT_ID = "14yvG4FmByEp2Te4gIPQ5FPQ2n6hwSN-quB7b95WRQ1U";
// Accounts: one Google Sheet each (same layout). Each must also be listed in SHEETS in the Apps Script.
const DEFAULT_ACCOUNTS = [{name:"MCU", id:DEFAULT_ID}, {name:"WNC", id:"109ZOrysstYv1adeMnFclmQD_dmK92RVXOx0kcpql18E"}];
function getAccounts(){ try { const a = JSON.parse(lsGet("cf_accounts") || "null"); if (Array.isArray(a) && a.length) return a; } catch(e){} return DEFAULT_ACCOUNTS; }
function saveAccounts(a){ lsSet("cf_accounts", JSON.stringify(a)); }
// Nov 7, 2026: the main account is called "MCU" in the app (the sheet is still "Cash Flow"). One time only, so a later rename in Settings sticks.
if (!lsGet("cf_mcu")) { try { const a = JSON.parse(lsGet("cf_accounts") || "null"); if (Array.isArray(a)) { a.forEach(x => { if (x.id === DEFAULT_ID && (x.name === "Cash Flow" || x.name === "Mountain")) x.name = "MCU"; }); saveAccounts(a); } } catch(e){} lsSet("cf_mcu", "1"); }
const acctName = id => (getAccounts().find(a => a.id === id) || {}).name || "Account";
// settings that belong to one account (main account keeps the original keys)
const akey = (base, id) => ((id || S.id) === DEFAULT_ID ? base : base + ":" + (id || S.id));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

let mcp = null;
const S = { id: (getAccounts().find(a => a.id === lsGet("cf_acct")) || getAccounts()[0]).id, tabs: [], month: null, spend: {items:[],lastRow:1}, save: {items:[],lastRow:1},
  view: "timeline", heroPanel: lsGet("cf_hero") || "", loading: true, err: null, busy: false };

/* ---------- dates & money ---------- */
const EPOCH = Date.UTC(1899,11,30);
const parts = s => { const d = new Date(EPOCH + Math.round(s)*864e5); return {y:d.getUTCFullYear(), m:d.getUTCMonth(), d:d.getUTCDate(), w:d.getUTCDay()}; };
const toSerial = (y,m,d) => Math.round((Date.UTC(y,m,d) - EPOCH)/864e5);
const todaySerial = () => { const n = new Date(); return toSerial(n.getFullYear(), n.getMonth(), n.getDate()); };
const isoToSerial = iso => { const [y,m,d] = iso.split("-").map(Number); return toSerial(y,m-1,d); };
const serialToIso = s => { const p = parts(s); return `${p.y}-${String(p.m+1).padStart(2,"0")}-${String(p.d).padStart(2,"0")}`; };
const serialToUS = s => { const p = parts(s); return `${p.m+1}/${p.d}/${p.y}`; };
function usToSerial(t){
  const m = String(t||"").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return toSerial(y, +m[1]-1, +m[2]); }
  const d = new Date(t); return isNaN(d) ? null : toSerial(d.getFullYear(), d.getMonth(), d.getDate());
}
const dayLabel = s => { const p = parts(s); return `${DOW[p.w]}, ${MON[p.m]} ${p.d}`; };
const short = s => { const p = parts(s); return `${MON[p.m]} ${p.d}`; };
const money = n => (n < 0 ? "-" : "") + "$" + Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
// true if what was typed is a plain amount like 12, 12.5, $1,234.56, -40 or (40) — not "12abc"
function moneyOK(t){
  const s = String(t == null ? "" : t).replace(/[$\s]/g, "");
  return /^(-?|\()(\d{1,3}(,\d{3})+|\d+)?(\.\d{0,2})?\)?$/.test(s) && /\d/.test(s) && (s.startsWith("(") === s.endsWith(")"));
}
function parseMoney(t){
  if (t == null || t === "") return 0; if (typeof t === "number") return t;
  let s = String(t).replace(/[$,\s]/g,""); if (s === "-" || s === "") return 0;
  const neg = /^\(.*\)$/.test(s) || s.startsWith("-"); const n = parseFloat(s.replace(/[()\-]/g,""));
  return isNaN(n) ? 0 : (neg ? -n : n);
}
const round2 = n => Math.round(n*100)/100;
const qt = t => `'${t.replace(/'/g,"''")}'`;
const norm = s => String(s||"").trim().toLowerCase().replace(/\s+/g," ");

/* ---------- connector ---------- */
const CFG = { url: lsGet("cf_api") || "", key: lsGet("cf_key") || "" };
const READS = new Set(["get_spreadsheet", "get_values"]);
// The key is only ever sent to a Google Apps Script web app link (https://script.google.com/…), never anywhere else
function apiLinkOK(u){
  try { const x = new URL(u); return x.protocol === "https:" && x.hostname === "script.google.com" && x.pathname.includes("/macros/"); }
  catch(e){ return false; }
}
async function apiCall(tool, input){
  if (!CFG.url || !CFG.key) throw {code:"not_setup", message:"Add your Apps Script link and key in Settings."};
  if (!apiLinkOK(CFG.url)) throw {code:"bad_response", message:"The link in Settings isn't a Google Apps Script web app link."};
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), READS.has(tool) ? 25000 : 60000);
  let res;
  try {
    res = await fetch(CFG.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({key: CFG.key, tool, input}), signal: ctl.signal, redirect:"follow"});
  } catch(e) { throw {code:"server_unavailable", message: navigator.onLine ? "Couldn't reach your Apps Script." : "No signal."}; }
  finally { clearTimeout(tm); }
  let j = null; try { j = await res.json(); } catch(e) {}
  if (!j) throw {code:"bad_response", message:"The Apps Script link didn't answer as expected."};
  if (j.error) throw {code: j.code || "tool_error", message: j.error};
  return j.result;
}
// Saved copies of everything the app reads, so it still shows your numbers with no signal
function cacheGet(k){ try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e){ return null; } }
function cacheSet(k, p){
  const v = JSON.stringify({t: Date.now(), p});
  try { localStorage.setItem(k, v); }
  catch(e) {   // storage full: drop the oldest saved copies and try once more
    try {
      const keys = Object.keys(localStorage).filter(x => x.startsWith("cf_c:")).map(x => [x, (cacheGet(x) || {}).t || 0]).sort((a, b) => a[1] - b[1]);
      keys.slice(0, Math.ceil(keys.length / 2)).forEach(([x]) => localStorage.removeItem(x));
      localStorage.setItem(k, v);
    } catch(e2) {}
  }
}
async function call(tool, input, cacheOnly){
  const isRead = READS.has(tool), k = isRead ? "cf_c:" + tool + ":" + JSON.stringify(input) : null;
  if (isRead && cacheOnly) {   // saved copy only, no network: used to show the app instantly on open
    const c = cacheGet(k); if (c) { S.fromCache = Math.min(S.fromCache || Infinity, c.t); return c.p; }
    throw {code:"nocache", message:"Not saved on this device yet."};
  }
  if (isRead && !navigator.onLine) {
    const c = cacheGet(k); if (c) { S.fromCache = Math.min(S.fromCache || Infinity, c.t); return c.p; }
    throw {code:"offline", message:"No signal, and this hasn't been opened online yet."};
  }
  try { const p = await apiCall(tool, input); if (isRead) cacheSet(k, p); return p; }
  catch(e) {
    if (isRead && (e.code === "server_unavailable" || e.code === "bad_response")) { const c = cacheGet(k); if (c) { S.fromCache = Math.min(S.fromCache || Infinity, c.t); return c.p; } }
    throw e;
  }
}
const upd = (range, values) => call("update_values", {spreadsheetId:S.id, range, values});

function errInfo(e){
  const code = e && e.code;
  const map = {
    needs_reauth: ["Wrong key","The key in Settings doesn't match the KEY in your Apps Script. Fix it in Settings (⚙︎)."],
    not_setup: ["Connect your sheet","Tap ⚙︎ Settings and add your Apps Script web app link and key."],
    script_outdated: ["Apps Script update needed", e && e.message],
    bad_response: ["Apps Script link isn't right","Check Settings: it should be the Web app URL ending in /exec, deployed with access set to Anyone."],
    offline: ["No signal","This part hasn't been loaded on this device yet. It will load once you're back online."],
    server_unavailable: ["Couldn't reach your sheet","It may be a brief hiccup or no signal. Tap Try again."],
    layout: ["Sheet layout changed", e && e.message],
    tool_error: ["Google Sheets reported a problem", (e && e.message) || "Check your Apps Script in Settings."],
  };
  return map[code] || ["Something went wrong", (e && e.message) || String(e)];
}

/* ---------- loading ---------- */
const MONTH_RE = /^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (\d{4})$/;
const tabKey = t => { const m = t.match(MONTH_RE); return m ? (+m[2])*12 + MON.indexOf(m[1]) : null; };

// the exact requests each read makes (shared with the one-trip batch read below so they use the same saved copies)
const REQ = {
  tabs: () => ["get_spreadsheet", {spreadsheetId:S.id, fields:["properties.title","sheets.properties.title","sheets.properties.sheetId"]}],
  month: title => ["get_spreadsheet", {spreadsheetId:S.id, includeGridData:true, ranges:[`${qt(title)}!A1:I300`],
    fields:["sheets.data.rowData.values.userEnteredValue","sheets.data.rowData.values.effectiveValue"]}],
  log: tab => ["get_values", {spreadsheetId:S.id, range:`${qt(tab)}!A2:E20000`}]
};
// the Apps Script says whether it can answer several reads in one trip (newer versions list "batch")
let batchOK = false;
// newer Apps Script adds rows in one step on its side, and remembers each change's ID so a retry never adds it twice
let serverAdds = false, calOK = false, affirmOK = false;
const newOpId = () => Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
// One trip to the Apps Script for many reads; saves each answer like a normal read. Returns false if it couldn't.
async function prefetch(reqs){
  if (!batchOK || !navigator.onLine) return false;   // older Apps Script: use one request per read
  try {
    const r = await apiCall("batch", {calls: reqs.map(([tool, input]) => ({tool, input}))});
    const res = (r && r.results) || [];
    if (res.length !== reqs.length || res.some(x => !x || x.error)) return false;
    reqs.forEach(([tool, input], i) => cacheSet("cf_c:" + tool + ":" + JSON.stringify(input), res[i].result));
    return true;
  } catch(e) {
    if (e.code === "bad_request" || e.code === "tool_error") batchOK = false;
    else if (e.code === "needs_reauth") throw e;
    return false;
  }
}
async function loadTabs(cacheOnly){
  const p = await call(...REQ.tabs(), cacheOnly);
  S.title = p.properties && p.properties.title;
  const feats = (p.properties && Array.isArray(p.properties.features)) ? p.properties.features : [];
  batchOK = feats.indexOf("batch") >= 0;
  serverAdds = feats.indexOf("add_item") >= 0 && feats.indexOf("add_log") >= 0;
  const hadCal = calOK; calOK = feats.indexOf("calendar") >= 0; affirmOK = feats.indexOf("affirm") >= 0;
  if (calOK && !hadCal) setTimeout(() => { if (matchMedia("(min-width: 900px)").matches) loadCal(); }, 0);
  if (affirmOK && !S.affirm) setTimeout(() => loadAffirm(), 0);
  // Safety: the Apps Script must confirm it opened this account's sheet (older scripts always open Cash Flow)
  const got = p.properties && p.properties.spreadsheetId;
  if (S.id !== DEFAULT_ID && got !== S.id) { S.tabs = []; throw {code:"script_outdated", message:`Your Apps Script needs the update that lets it open “${acctName(S.id)}”. Paste the new Code.gs and redeploy, then tap Try again.`}; }
  S.tabs = (p.sheets||[]).map(s => s.properties).filter(t => MONTH_RE.test(t.title)).sort((a,b) => tabKey(a.title) - tabKey(b.title));
  if (!S.tabs.length) throw {code:"layout", message:"No month tabs (like “Nov 2026”) were found in this sheet."};
}
function tabForSerial(s){
  const p = parts(s), key = p.y*12 + p.m;
  const exact = S.tabs.find(t => tabKey(t.title) === key);
  if (exact) return exact.title;
  if (S.tabs.length && key < tabKey(S.tabs[0].title)) return S.tabs[0].title;
  return null;
}

function parseGrid(rd){
  const cell = (r,c) => { const row = rd[r-1]; return (row && row.values && row.values[c]) || {}; };
  const num = (r,c) => { const e = cell(r,c).effectiveValue; return e && typeof e.numberValue === "number" ? e.numberValue : 0; };
  const str = (r,c) => { const u = cell(r,c).userEnteredValue; if (!u) return ""; if (u.stringValue != null) return u.stringValue; if (u.numberValue != null) return String(u.numberValue); return ""; };
  const fx = (r,c) => { const u = cell(r,c).userEnteredValue; return (u && u.formulaValue) || null; };
  const has = (r,c) => !!cell(r,c).userEnteredValue;
  return {cell, num, str, fx, has};
}

async function loadMonth(title, cacheOnly){
  const t = S.tabs.find(x => x.title === title);
  const p = await call(...REQ.month(title), cacheOnly);
  const rd = (p.sheets && p.sheets[0] && p.sheets[0].data && p.sheets[0].data[0] && p.sheets[0].data[0].rowData) || [];
  const {cell, num, str, fx, has} = parseGrid(rd);
  let hdr = 0;
  for (let r = 1; r <= rd.length; r++) if (str(r,0) === "Date" && /^Running/i.test(str(r,5))) { hdr = r; break; }
  if (!hdr) throw {code:"layout", message:`Couldn't find the Date / Running Balance header on “${title}”.`};
  const rows = []; let last = 0;
  for (let r = hdr+1; r <= rd.length; r++){
    const fF = fx(r,5);
    if (!fF) break;
    last = r;
    const desc = str(r,2).trim();
    const uA = cell(r,0).userEnteredValue;
    const serial = uA && typeof uA.numberValue === "number" ? uA.numberValue : null;
    const dF = fx(r,3), eF = fx(r,4);
    let kind;
    if (r === hdr+1 || /^starting balance/i.test(desc)) kind = "start";
    else if (eF && /Spending Log/.test(eF)) kind = "spend";
    else if (eF && /Savings Log/.test(eF)) kind = "save";
    else if (!desc && !has(r,3) && !has(r,4)) kind = "blank";
    else if (num(r,3) !== 0 || (!has(r,4) && /pay|income|deposit|refund|bonus/i.test(desc))) kind = "income";
    else kind = "bill";
    rows.push({r, serial, desc, inc:num(r,3), bill:num(r,4), bal:num(r,5), note:str(r,6), kind, dF, eF, cleared: !!str(r,8) && str(r,8) !== "FALSE"});
  }
  const sum = {income:num(4,4), bills:num(5,4), spend:num(6,4), lowest:num(7,4), ending:num(8,4), saved:num(9,4), saveEnd:num(10,4), start:num(4,1), saveStart:num(5,1)};
  return {title, sheetId:t.sheetId, hdr, first:hdr+1, last, rows, sum, e8:fx(8,4), hdrI: str(hdr,8)};
}

async function loadLog(tab, cacheOnly){
  const p = await call(...REQ.log(tab), cacheOnly);
  const v = (p && p.values) || []; const items = []; let lastRow = 1;
  v.forEach((row, i) => {
    const r = i + 2;
    if (row.some(x => x !== "" && x != null)) lastRow = r;
    const serial = usToSerial(row[0]); if (serial == null) return;
    const text = String(row[1]||"").trim(), amt = parseMoney(row[2]);
    if (text === "(deleted)" && amt === 0) return;
    items.push({r, serial, text, amt, cleared: !!row[4] && String(row[4]).toUpperCase() !== "FALSE"});
  });
  return {items, lastRow};
}

// Everything one screen needs, read together (in parallel)
async function gather(title, cacheOnly){
  const T = todaySerial();
  const pTitles = periodTabs(T).filter(t => t !== title);
  const [m, sp, sv, ...others] = await Promise.all([loadMonth(title, cacheOnly), loadLog("Spending Log", cacheOnly), loadLog("Savings Log", cacheOnly), ...pTitles.map(t => loadMonth(t, cacheOnly).catch(() => null))]);
  return {m, sp, sv, months: [m, ...others.filter(Boolean)].sort((a,b) => tabKey(a.title) - tabKey(b.title))};
}
function applyData(d){ S.month = d.m; S.spend = d.sp; S.save = d.sv; S.periodMonths = d.months; }
let loadSeq = 0;
let batchedTitles = new Set();   // month tabs the last full refresh already re-read in its one trip
async function loadAll(pickTitle, timer){
  const seq = ++loadSeq, sid = S.id;
  const stale = () => seq !== loadSeq || sid !== S.id;
  const want = () => pickTitle || (S.month && S.month.title) || tabForSerial(todaySerial()) || S.tabs[S.tabs.length-1].title;
  S.err = null;
  // 1) Show the copy saved on this device right away, so the app never sits on a blank screen waiting for a slow signal
  if (!S.month || (pickTitle && S.month.title !== pickTitle)) {
    S.fromCache = null;
    try {
      if (!S.tabs.length) await loadTabs(true);
      const d = await gather(want(), true);
      if (stale()) return;
      applyData(d); S.loadedAt = new Date(S.fromCache || Date.now());
    } catch(e) { /* nothing saved yet: fall through to the network */ }
  }
  if (stale()) return;
  // 2) Then quietly fetch the fresh copy from the sheet
  S.loading = !S.month; S.refreshing = !!S.month; S.fromCache = null; render();
  try{
    let d = null;
    batchedTitles = new Set();
    if (S.tabs.length) {
      // newer Apps Script: everything in one trip, then read it back from the saved copies
      const title = want(), pT = periodTabs(todaySerial()).filter(t => t !== title);
      if (await prefetch([REQ.tabs(), REQ.month(title), REQ.log("Spending Log"), REQ.log("Savings Log"), ...pT.map(REQ.month)])) {
        if (stale()) return;
        batchedTitles = new Set([title, ...pT]);
        await loadTabs(true); d = await gather(title, true); S.fromCache = null;
      }
    }
    if (!d) {
      const tabsP = loadTabs();             // runs alongside the month and logs when the tab list is already known
      if (!S.tabs.length) await tabsP;
      [, d] = await Promise.all([tabsP, gather(want(), false)]);
    }
    if (stale()) return;
    applyData(d);
    S.loadedAt = S.fromCache ? new Date(S.fromCache) : new Date();
    S.offline = !!S.fromCache; S.err = null;
  } catch(e){
    if (stale()) return;
    if (S.month && (!navigator.onLine || e.code === "server_unavailable" || e.code === "offline")) S.offline = true; else S.err = e;
  }
  S.loading = false; S.refreshing = false; render();
  // the every-minute refresh only re-reads the month you're looking at; the other months on the timeline are re-read after a change, a manual refresh or coming back to the app
  if (!S.err && !timer) tlRefreshOthers();
}

/* ---------- cleared marks ---------- */
function clearedLine(){
  const m = S.month; if (!m) return "";
  const T = todaySerial();
  let bal = m.sum.start, n = 0, open = 0;
  for (const r of m.rows) {
    if (r.kind === "blank" || r.kind === "start" || r.kind === "spend") continue;
    const amt = (r.inc || 0) - (r.bill || 0); if (!amt) continue;
    if (r.cleared) { bal += amt; n++; } else if (r.serial != null && r.serial <= T) open++;
  }
  for (const it of S.spend.items) {
    if (!it.amt || tabForSerial(it.serial) !== m.title) continue;
    if (it.cleared) { bal -= it.amt; n++; } else if (it.serial <= T) open++;
  }
  return `<div class="clrline">Cleared balance <b>${money(bal)}</b><span class="clrsub">${n} cleared${open ? ` · <span class="neg">${open} waiting to clear</span>` : ""}</span></div>`;
}
async function toggleCleared(target, r, title){
  let op;
  if (target === "log") {
    const it = S.spend.items.find(i => i.r === r); if (!it) return;
    it.cleared = !it.cleared;
    op = {type:"clear", target:"log", tab:"Spending Log", r, val:it.cleared, text:it.text};
  } else {
    title = title || S.month.title;
    // the same row can be held by the month you're viewing and by the summaries' month list; flip both copies
    const copies = [S.month, ...(S.periodMonths || [])].filter(m => m && m.title === title).map(m => m.rows.find(x => x.r === r)).filter(Boolean);
    if (!copies.length) return;
    const val = !copies[0].cleared; const seen = new Set();
    copies.forEach(c => { if (!seen.has(c)) { c.cleared = val; seen.add(c); } });
    const row = copies[0];
    op = {type:"clear", target:"row", title, r, serial:row.serial, desc:row.desc, val};
  }
  const tl = $("#tl"), top = tl ? tl.scrollTop : 0;
  renderHero(); renderView(); if ($("#tl")) $("#tl").scrollTop = top;
  if (!navigator.onLine || S.queue.length || flushing) { enqueue(op, false); return; }
  try { await execOp(op); }
  catch(e){
    if (!navigator.onLine || NETWORKISH.has(e && e.code)) { enqueue(op, true); toast("Saved on this phone — will sync"); }
    else { const [h, b] = errInfo(e); toast(`${h}. ${b || ""}`, 5000); loadAll(); }
  }
}

/* ---------- uncleared list ---------- */
function unclearedList(){ try { return unclearedItems_(); } catch(e){ return []; } }
function unclearedItems_(){
  const T = todaySerial(), list = [], seenRow = new Set();
  const months = [...(S.periodMonths || [])];
  if (S.month && !months.some(m => m.title === S.month.title)) months.push(S.month);
  for (const m of months) for (const r of m.rows) {
    const key = m.title + "#" + r.r;
    if (seenRow.has(key)) continue; seenRow.add(key);
    if (r.cleared || r.serial == null || r.serial > T) continue;
    if (r.kind === "blank" || r.kind === "start" || r.kind === "spend") continue;
    const amt = (r.inc || 0) - (r.bill || 0); if (!amt) continue;
    let desc = r.desc, sub = r.note;
    if (r.kind === "save") { const mm = r.desc.match(/\(([^)]*)\)/); desc = r.bill < 0 ? "Pulled from savings" : "Moved to savings"; sub = (mm ? mm[1] + " · " : "") + "Savings Log"; }
    list.push({s:r.serial, amt, desc, sub: sub || (r.kind === "income" ? "Income" : "Bill"), kind:r.kind, open:`data-unc="row" data-r="${r.r}" data-title="${esc(m.title)}"`});

}
function unclearedHTML(){
  const T = todaySerial(), list = unclearedItems_();
  const net = list.reduce((a, x) => a + x.amt, 0);
  const out = list.reduce((a, x) => a + (x.amt < 0 ? -x.amt : 0), 0), inn = list.reduce((a, x) => a + (x.amt > 0 ? x.amt : 0), 0);

  return html + `<p class="hint" style="text-align:center">Tap an item, then “Mark as cleared” once it shows up in your bank. It moves off this list and into your cleared balance.</p>`;

/* ---------- offline queue ---------- */
// Each change is an "op". Online: run it now. Offline (or the send fails): keep it on this phone and send it later.
function loadQueue(){ try { return JSON.parse(lsGet("cf_queue") || "[]"); } catch(e){ return []; } }
function saveQueue(){ lsSet("cf_queue", JSON.stringify(S.queue)); renderQueue(); if (S.month && S.view === "timeline") renderView(); }
S.queue = loadQueue();
const NETWORKISH = new Set(["server_unavailable","upstream_error","rate_limited","offline","bad_response"]);

async function execOp(op){
  const res = await execOp0(op);
  // "Also add to my Bills calendar" from the Add bill screen (the opId keeps a retry from adding it twice)
  if (op.cal && calOK) { try { await call("cal_add", {...op.cal, opId: (op.opId || newOpId()) + "|cal"}); loadCal(true); } catch(e) { if (NETWORKISH.has(e && e.code)) throw e; toast("Added to the timeline, but the calendar didn't take it: " + (errInfo(e)[0] || ""), 6000); } }
  return res;
}
async function execOp0(op){
  S.opCtx = op.opId ? {id: op.opId, seen: {}} : null;   // lets each row this change adds get a fixed ID
  if (op.type === "affirmpay") {
    if (!affirmOK) throw {code:"script_outdated", message:"Paste the new Apps Script to record Affirm payments."};
    await call("affirm_pay", {opId: op.opId, planId: op.planId, amount: op.amt, date: op.date, note: op.note, kind: op.regular ? "regular" : "extra"});
    if (op.timeline && tabForSerial(op.serial)) await addItem("bill", op.serial, `Affirm ${op.name}`, op.amt, op.regular ? "Affirm payment" : (op.amt >= 0 ? "Affirm extra payment" : ""), false);
    if (op.removeLater) {
      const later = await laterAffirmBills(op.payment, op.serial);
      let i = 0; for (const t of later) { toast(`Removing later bills ${++i} of ${later.length}…`, 0); const mm = await loadMonth(t.title); const rr = mm.rows.find(x => x.r === t.r && norm(x.desc) === norm(t.desc)); if (rr) await removeRow(mm, rr); }
    }
    S.affirm = null; loadAffirm(true);
    return 1;
  }
  if (op.type === "log") {
    if (serverAdds && op.opId) return addLog(op.tab, op.serial, op.text, op.amt, op.cleared, op.opId);
    if (op.maybeSent) {   // the earlier try might have landed: skip if an identical row is already there
      const fresh = await loadLog(op.tab);
      if (fresh.items.some(i => i.serial === op.serial && norm(i.text) === norm(op.text) && Math.abs(i.amt - op.amt) < 0.005)) return;
    }
    return addLog(op.tab, op.serial, op.text, op.amt, op.cleared);
  }
  if (op.type === "item") {
    if (op.maybeSent && !(serverAdds && op.opId)) {
      const t = tabForSerial(op.serial); const m = t && await loadMonth(t);
      const amtKey = op.kind === "income" ? "inc" : "bill";
      if (m && m.rows.some(r => r.serial === op.serial && norm(r.desc) === norm(op.desc) && Math.abs(r[amtKey] - op.amt) < 0.005)) return;
    }
    return addItem(op.kind, op.serial, op.desc, op.amt, op.note, op.cleared);
  }
  if (op.type === "row") {
    const m = await loadMonth(op.title);
    let row = m.rows.find(r => r.r === op.r && norm(r.desc) === norm(op.origDesc));
    if (!row) row = m.rows.find(r => r.serial === op.serial && norm(r.desc) === norm(op.origDesc));
    if (!row) throw {code:"layout", message:`Couldn't find “${op.origDesc}” on ${op.title} anymore.`};
    return saveRow(m, row, op.desc, op.amt, op.note, op.scope, op.newSerial, op.newKind);
  }
  if (op.type === "clearmove") {
    // cleared early: move to today (just this one, or shift every later one by the same days) and mark it cleared
    const m = await loadMonth(op.title);
    const row = m.rows.find(r => r.serial === op.serial && r.kind === op.kind && norm(r.desc) === norm(op.desc));
    if (!row) throw {code:"layout", message:`Couldn't find “${op.desc}” on ${op.title} anymore.`};
    if (!m.hdrI) await upd(`${qt(op.title)}!I${m.hdr}`, [["Cleared"]]);
    return moveRows(m, row, row.desc, null, row.note, op.scope, op.newSerial, {clearFirst:true});
  }
  if (op.type === "clearmovelog") {
    const fresh = await loadLog("Spending Log"); const it = fresh.items.find(i => i.r === op.r);
    if (!it) throw {code:"layout", message:"That expense isn't there anymore."};
    if (!S.logHdrDone) { await upd(`'Spending Log'!E1`, [["Cleared"]]); S.logHdrDone = true; }
    return upd(`'Spending Log'!A${op.r}:C${op.r}`, [[serialToUS(op.newSerial), it.text, it.amt]]).then(() => upd(`'Spending Log'!E${op.r}`, [["✓"]]));
  }
  if (op.type === "repeat") {
    // a new bill or income on every date (from the Repeats choice when adding). Only the first one can be marked cleared.
    let n = 0, skipped = 0;
    const amtKey = op.kind === "income" ? "inc" : "bill";
    for (const d of op.dates) {
      toast(`Adding ${n + skipped + 1} of ${op.dates.length}…`, 0);
      if (op.maybeSent && !(serverAdds && op.opId)) {   // older Apps Script: skip any that already landed on an earlier try
        const t = tabForSerial(d), m = t && await loadMonth(t);
        if (m && m.rows.some(r => r.serial === d && norm(r.desc) === norm(op.desc) && Math.abs(r[amtKey] - op.amt) < 0.005)) { n++; continue; }
      }
      try { await addItem(op.kind, d, op.desc, op.amt, op.note, n === 0 && op.cleared); n++; }
      catch(e){ if (NETWORKISH.has(e && e.code) || !navigator.onLine) throw e; skipped++; if (n === 0 && skipped === 1 && d === op.dates[0]) throw e; }
    }
    return n;
  }
  if (op.type === "makerepeat") {
    // turn a logged expense into a repeating bill: take it off the Spending Log, then add a bill on every date
    const fresh = await loadLog("Spending Log"); const it = fresh.items.find(i => i.r === op.r);
    if (op.maybeSent && !(serverAdds && op.opId) && !(it && norm(it.text) === norm(op.origText))) return 0;   // already done on an earlier try
    if (it && norm(it.text) === norm(op.origText)) await deleteLog("Spending Log", it);
    let n = 0, skipped = 0;
    for (const d of op.dates) {
      toast(`Adding ${n + skipped + 1} of ${op.dates.length}…`, 0);
      try { await addItem("bill", d, op.text, op.amt, op.note, n === 0 && op.cleared); n++; } catch(e){ skipped++; if (n === 0 && skipped === 1 && d === op.dates[0]) throw e; }
    }
    return n;
  }
  if (op.type === "clear") {
    const mark = op.val ? "✓" : "";
    if (op.target === "log") {
      if (!S.logHdrDone) { await upd(`${qt(op.tab)}!E1`, [["Cleared"]]); S.logHdrDone = true; }
      return upd(`${qt(op.tab)}!E${op.r}`, [[mark]]);
    }
    const m = await loadMonth(op.title);
    let row = m.rows.find(r => r.r === op.r && norm(r.desc) === norm(op.desc));
    if (!row) row = m.rows.find(r => r.serial === op.serial && norm(r.desc) === norm(op.desc));
    if (!row) throw {code:"layout", message:`Couldn't find “${op.desc}” on ${op.title} anymore.`};
    if (!m.hdrI) await upd(`${qt(op.title)}!I${m.hdr}`, [["Cleared"]]);
    return upd(`${qt(op.title)}!I${row.r}`, [[mark]]);
  }
  if (op.type === "editlog") {
    const fresh = await loadLog(op.tab);
    const it = fresh.items.find(i => i.r === op.r);
    if (!it) throw {code:"layout", message:"That log entry isn't there anymore."};
    return editLog(op.tab, it, op.serial, op.text, op.amt);
  }
}
function enqueue(op, maybeSent){
  S.queue.push({sid: S.id, ...op, qid: Date.now() + "-" + Math.random().toString(36).slice(2,7), maybeSent: !!maybeSent, at: Date.now()});
  saveQueue();
}
async function submitOp(op, label, done){

  if (!navigator.onLine || S.queue.length || flushing) {

    enqueue(op, false); closeSheet();
    toast(navigator.onLine ? "Saved — sending after the earlier changes" : "No signal — saved on this phone, will sync", 3500);
    if (navigator.onLine) flushQueue();

function periodRanges(T){

  const mo = [toSerial(p.y, p.m, 1), toSerial(p.y, p.m + 1, 0)];

  return [
    {key:"day", name:"Today", a:T, b:T, sub:dayLabel(T)},
    {key:"week", name:"This pay week", a:wk[0], b:wk[1], sub:`${short(wk[0])} – ${short(wk[1])}`},
    {key:"month", name:"This month", a:mo[0], b:mo[1], sub:`${MON[p.m]} ${p.y}`},
    {key:"quarter", name:`Q${q0/3 + 1}`, a:qt_[0], b:qt_[1], sub:`${MON[q0]} – ${MON[q0+2]} ${p.y}`},

}
function periodTabs(T){
  if (!S.tabs.length) return [];
  const set = new Set();
  for (const r of periodRanges(T)) {
    for (let s = r.a; s < r.b; s += 7) { const t = tabForSerial(s); if (t) set.add(t); }
    const t = tabForSerial(r.b); if (t) set.add(t);

}
function safeStats(){
  const months = S.periodMonths || []; if (!months.length) return null;
  const T = todaySerial(), p = parts(T);
  const end = toSerial(p.y, p.m + 2, 0);              // last day of next month
  const rows = [];
  months.forEach((m, mi) => m.rows.forEach(r => { if (r.kind === "blank" || r.serial == null) return; if (r.kind === "start" && mi > 0) return; rows.push(r); }));
  let now = null; for (const r of rows) if (r.serial <= T) now = r.bal;
  if (now == null) now = rows.length ? rows[0].bal : 0;
  // Anything spent today lowers every balance after it, so the safe amount is the lowest point from now to `end`
  let low = now, lowDay = T;
  for (const r of rows) if (r.serial > T && r.serial <= end && r.bal < low) { low = r.bal; lowDay = r.serial; }
  const covered = rows.length ? rows[rows.length-1].serial : T;

  const first = S.spend.items.length ? Math.min(...S.spend.items.map(i => i.serial)) : T;

  const pace = days > 0 ? spent / days * 7 : 0;
  // After the tightest day, how much more room opens up (lowest later balance minus the low point)?

function mergedRows(){

// payToday: a payment made today (e.g. an Affirm payoff), to see what it does to the allowance
function planStats(payToday){
  const rows = mergedRows(); if (!rows.length) return null;
  const x = payToday || 0;
  const T = todaySerial(), p = parts(T), end = toSerial(p.y, p.m + 2, 0);
  const goal = getGoal(), cushion = getCushion();
  let balNow = rows[0].bal; for (const r of rows) if (r.serial <= T) balNow = r.bal;
  const spentToday = S.spend.items.filter(i => i.serial === T).reduce((a, i) => a + i.amt, 0);
  // lowest point of each future day, plus the end of the horizon
  const lows = new Map();
  for (const r of rows) if (r.serial > T && r.serial <= end) lows.set(r.serial, Math.min(lows.has(r.serial) ? lows.get(r.serial) : Infinity, r.bal));
  let endBal = balNow; for (const r of rows) if (r.serial <= end) endBal = r.bal;
  if (!lows.has(end)) lows.set(end, endBal);
  const paydays = rows.filter(r => r.kind === "income" && r.serial > T && r.serial <= end).map(r => r.serial);
  const solve = g => {
    // daily amount d so that, at every checkpoint t: balance(t) + today's spending already counted − cushion − savings set aside on each payday so far − d × days ≥ 0
    let d = Infinity, tight = T;
    const check = (t, bal) => {
      const days = t - T + 1, saved = g * paydays.filter(s => s <= t).length;
      const v = (bal - x + spentToday - cushion - saved) / days;
      if (v < d) { d = v; tight = t; }
    };
    check(T, balNow);
    for (const [t, bal] of lows) check(t, bal);
    return {d, tight};
  };

/* ---------- Affirm payoff ---------- */
// Snowball: every plan gets its monthly payment; the extra plus every freed-up payment goes to the smallest balance. Interest = APR/12 on each balance.
function snowball(plans, extra){
  let ps = plans.filter(p => p.balance > 0.005).map(p => ({...p, bal: p.balance}));
  const budget = ps.reduce((a, p) => a + p.payment, 0) + extra, start = parts(todaySerial());
  const out = {months: 0, interest: 0, payoff: {}, schedule: []};
  for (let k = 0; ps.length && k < 120; k++) {
    let interest = 0;
    ps.forEach(p => { const i = p.bal * p.apr / 12; p.bal += i; interest += i; });
    let left = budget;
    ps.forEach(p => { const pay = Math.min(p.payment, p.bal); p.bal -= pay; left -= pay; });
    ps.sort((a, b) => a.bal - b.bal);
    for (const p of ps) { if (left <= 0) break; const pay = Math.min(left, p.bal); p.bal -= pay; left -= pay; }
    const label = `${MON[(start.m + k) % 12]} ${start.y + Math.floor((start.m + k) / 12)}`;
    const done = ps.filter(p => p.bal <= 0.005);
    done.forEach(p => { out.payoff[p.id] = label; });
    ps = ps.filter(p => p.bal > 0.005);
    out.interest += interest; out.months = k + 1;
    out.schedule.push({label, paid: budget - Math.max(0, left), interest, left: ps.reduce((a, p) => a + p.bal, 0), done: done.map(p => p.name)});
    out.doneLabel = label;
  }
  return out;
}
const getAffExtra = () => { const v = parseFloat(lsGet("cf_affx")); return isNaN(v) ? 200 : v; };
function affirmPlan(){
  if (!S.affirm || !S.affirm.plans) return null;
  const active = S.affirm.plans.filter(p => p.balance > 0.005 && !/paid/i.test(p.status)).sort((a, b) => a.balance - b.balance);
  const extra = getAffExtra(), sim = snowball(active, extra), base = snowball(active, 0);
  const total = active.reduce((a, p) => a + p.balance, 0), monthly = active.reduce((a, p) => a + p.payment, 0);

  // Suggest it only if the room left is at least what you actually spend a day (or 60% of today's room until there are 2 weeks of history).
  const ps0 = planStats(), ss = safeStats(), first = active[0];

    const after = amt => { const q = planStats(amt); return q ? q.daily : -1; };
    const line = (amt, d) => `Spending room: ${money(ps0.daily)} → <b>${money(d)}/day</b>${pace != null ? ` (you average ${money(pace)})` : ""}.`;

    else {

      const amt = Math.floor(lo / 5) * 5;

}

  const real = m.rows.filter(r => r.kind !== "blank" && r.serial != null);
  if (real.length && serial < real[0].serial) throw {code:"layout", message:`“${title}” starts on ${short(real[0].serial)}. Pick a later date.`};
  let pos = m.first;
  for (const row of real) if (row.serial <= serial) pos = row.r;

  await call("insert_dimension", {spreadsheetId:S.id, sheetId:m.sheetId, dimension:"ROWS", startIndex:pos, endIndex:pos+1, inheritFromBefore:true});
  await upd(`${tq}!A${n}:F${n}`, [[serialToUS(serial), DOW[p.w], desc, kind === "income" ? round2(amt) : "", kind === "bill" ? round2(amt) : "", `=F${pos}+D${n}-E${n}`]]);
  await upd(`${tq}!G${n}:I${n}`, [[note || "", "", cleared ? "✓" : ""]]);
  if (cleared && !m.hdrI) await upd(`${tq}!I${m.hdr}`, [["Cleared"]]);
  if (pos < m.last) {
    // the row that used to follow `pos` now sits at n+1 and still points at F{pos}; re-link it
    await upd(`${tq}!F${n+1}`, [[`=F${n}+D${n+1}-E${n+1}`]]);
  } else {
    // added after the last row: stretch the month totals to include it
    const L = m.last + 1, f = m.first;
    await upd(`${tq}!E4:E5`, [[`=SUM(D${f}:D${L})`], [`=SUM(E${f}:E${L})-E6-E9`]]);
    await upd(`${tq}!E7:E8`, [[`=MIN(F${f}:F${L})`], [`=F${L}`]]);
  }
}

async function saveRow(m, row, desc, amt, note, scope, newSerial, newKind){
  if (newSerial != null && row.serial != null && newSerial !== row.serial) return moveRows(m, row, desc, amt, note, scope, newSerial, {newKind});
  const isInc = (newKind || row.kind) === "income";
  const vals = isInc ? [desc, round2(amt), ""] : [desc, "", round2(amt)];
  const targets = [{title:m.title, r:row.r}];
  if (scope === "future") targets.push(...await findFuture(m, row));
  let i = 0;
  for (const t of targets){
    i++; if (targets.length > 1) toast(`Updating ${i} of ${targets.length}…`, 0);
    await upd(`${qt(t.title)}!C${t.r}:E${t.r}`, [vals]);
    if (note !== row.note && (t.title !== m.title || t.r === row.r || scope === "future")) await upd(`${qt(t.title)}!G${t.r}`, [[note]]);
  }
  return targets.length;
}
async function findFuture(m, row){
  const key = norm(row.desc), isInc = row.kind === "income", out = [];
  for (const r of m.rows) if (r.r > row.r && r.kind === row.kind && norm(r.desc) === key) out.push({title:m.title, r:r.r, serial:r.serial});
  const later = S.tabs.filter(t => tabKey(t.title) > tabKey(m.title));
  if (!later.length) return out;
  const p = await call("get_spreadsheet", {spreadsheetId:S.id, includeGridData:true, ranges:later.map(t => `${qt(t.title)}!A1:F300`),
    fields:["sheets.properties.title","sheets.data.rowData.values.userEnteredValue"]});
  for (const sh of (p.sheets||[])){
    const title = sh.properties && sh.properties.title;
    const rd = (sh.data && sh.data[0] && sh.data[0].rowData) || [];
    const {cell, str, fx, has} = parseGrid(rd);
    let hdr = 0; for (let r = 1; r <= rd.length; r++) if (str(r,0) === "Date") { hdr = r; break; }
    if (!hdr) continue;
    for (let r = hdr+1; r <= rd.length; r++){
      if (!fx(r,5)) break;
      if (norm(str(r,2)) !== key || fx(r,3) || fx(r,4)) continue;
      const rowIsInc = has(r,3) && !has(r,4);
      if (rowIsInc === isInc) { const u = cell(r,0).userEnteredValue; out.push({title, r, serial: u && typeof u.numberValue === "number" ? u.numberValue : null}); }
    }
  }
  out.sort((a,b) => (tabKey(a.title) - tabKey(b.title)) || (a.r - b.r));
  return out;
}
async function removeRow(m, row){
  await upd(`${qt(m.title)}!A${row.r}:E${row.r}`, [["","","","",""]]);
  if (row.note || row.cleared) await upd(`${qt(m.title)}!G${row.r}:I${row.r}`, [["", "", ""]]);
}
// Changing a date: take the item off its old day and put it back in on the new day (in whichever month tab that date falls).
// "future" moves every later matching item by the same number of days, so a bill moved from the 11th to the 15th moves in every month.
async function moveRows(m, row, desc, amt, note, scope, newSerial, opts = {}){
  const delta = newSerial - row.serial, kind = row.kind;
  const targets = [{title:m.title, serial:row.serial, first:true}];
  if (scope === "future") (await findFuture(m, row)).forEach(t => { if (t.serial != null) targets.push({title:t.title, serial:t.serial}); });
  let done = 0, skipped = 0;
  for (const t of targets){
    if (targets.length > 1) toast(`Moving ${done + skipped + 1} of ${targets.length}…`, 0);
    const mm = await loadMonth(t.title);
    const rr = mm.rows.find(x => x.serial === t.serial && x.kind === kind && norm(x.desc) === norm(row.desc));
    const dest = t.serial + delta;
    if (!rr || !tabForSerial(dest)) { skipped++; continue; }
    const own = kind === "income" ? rr.inc : rr.bill;
    const amount = amt == null ? own : (t.first || scope === "future" ? amt : own);
    await removeRow(mm, rr);
    try { await addItem(opts.newKind || kind, dest, desc, amount, t.first || scope === "future" ? note : rr.note, t.first && opts.clearFirst ? true : rr.cleared); done++; }
    catch(e){ skipped++; if (t.first) throw e; }
  }
  if (skipped) toast(`Moved ${done}; ${skipped} couldn't be moved (no month tab for that date)`, 5000);
  return done;
}

function monthTlHTML(m, isBase){
  const T = todaySerial();
  // Sheet rows, minus the weekly "Everyday spending" lumps…
  const entries = m.rows.filter(r => r.kind !== "blank" && r.kind !== "spend").map((r, i) => ({s:r.serial, o:0, i, row:r}));
  // …plus each Spending Log expense that this month tab counts, on its own date
  S.spend.items.filter(it => it.amt && tabForSerial(it.serial) === m.title).forEach((it, i) => entries.push({s:it.serial, o:1, i, it}));
  // changes saved on this device but not synced yet show up right away, marked as waiting
  (S.queue || []).filter(op => (op.sid || DEFAULT_ID) === S.id).forEach((op, i) => {
    if (op.type === "log" && op.tab === "Spending Log" && tabForSerial(op.serial) === m.title) entries.push({s:op.serial, o:2, i, pend:{desc:op.text, amt:-op.amt, kind:"spend"}});
    if (op.type === "item" && tabForSerial(op.serial) === m.title) entries.push({s:op.serial, o:2, i, pend:{desc:op.desc, amt: op.kind === "income" ? op.amt : -op.amt, kind:op.kind}});
  });
  entries.sort((a,b) => (a.s ?? -1) - (b.s ?? -1) || a.o - b.o || a.i - b.i);
  // Re-run the balance item by item (same math as the sheet's Running Balance column)
  let bal = m.sum.start;
  for (const e of entries){
    if (e.pend) bal += e.pend.amt;
    else if (e.it) bal -= e.it.amt;
    else if (e.row.kind === "start") bal = e.row.bal;
    else bal += (e.row.inc || 0) - (e.row.bill || 0);
    e.bal = round2(bal);
  }
  const groups = []; for (const e of entries) { const g = groups[groups.length-1]; if (g && g.s === e.s) g.rows.push(e); else groups.push({s:e.s, rows:[e]}); }
  let out = "", todayDone = false;
  const hasToday = groups.some(g => g.s === T);
  // earlier days fold behind one row (only when this month has today or later in it)
  const pastN = groups.filter(g => g.s != null && g.s < T).length;
  const fold = isBase && !S.showPast && pastN > 0 && groups.some(g => g.s != null && g.s >= T);
  if (fold) out += `<button class="pastrow" id="btnPast">Show ${pastN} earlier day${pastN === 1 ? "" : "s"} <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>`;
  for (const g of groups){
    if (fold && g.s != null && g.s < T) continue;
    // No entries dated today: drop a "Today" marker just before the first future day
    if (!todayDone && !hasToday && g.s != null && g.s > T && groups[0].s <= T) { out += `<div class="today" id="tlAnchor">Today · ${esc(dayLabel(T))}</div>`; todayDone = true; }
    const isToday = g.s === T;
    const endBal = g.rows[g.rows.length-1].bal;
    out += `<div class="${g.s != null && g.s < T ? "past" : ""}" ${isToday ? 'id="tlAnchor"' : ""}><div class="day ${isToday ? "isToday" : ""}"><span>${isToday ? "Today · " : ""}${g.s != null ? esc(dayLabel(g.s)) : ""}</span><span class="bal ${endBal < 0 ? "neg" : ""}">${money(endBal)}</span></div><div class="card group">${g.rows.map(e => e.pend ? pendHTML(e.pend, e.bal) : e.it ? expHTML(e.it, e.bal) : itemHTML(e.row, e.bal)).join("")}</div></div>`;
  }
  return out || `<div class="empty">Nothing on ${esc(m.title)} yet.</div>`;
}

document.addEventListener("input", e => { if ((e.target.id === "fDate" || e.target.id === "fUntil") && $("#arepSeg")) drawAddRepeat(); });
document.addEventListener("change", e => {
  if ((e.target.id === "fDate" || e.target.id === "fUntil") && $("#arepSeg")) drawAddRepeat();

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  const bad = ["#fAmt", "#fGoal", "#fCushion"].map(id => $(id)).find(el => el && el.value.trim() !== "" && !moneyOK(el.value));
  if (bad) { toast("That amount doesn't look right — use numbers like 45.99", 4000); bad.focus(); return; }
  const amtRaw = $("#fAmt") ? parseMoney($("#fAmt").value) : 0;
  if (f.id === "calForm") {
    const name = $("#fText").value.trim(); if (!name) { toast("Give it a name"); return; }
    const title = calTitle(name, amtRaw ? Math.abs(amtRaw) : null), note = $("#fNote").value.trim(), date = $("#fDate").value;
    if (!date) { toast("Pick a date"); return; }
    if (f.dataset.id) { const sc = f.querySelector("input[name=cscope]:checked");
      return calWrite({type:"calupd", input:{id: f.dataset.id, date: f.dataset.date, title, note, newDate: date, scope: sc ? sc.value : "one"}}, "Saving", "Calendar updated"); }
    const rp = document.querySelector("#crepSeg button.on").dataset.crep, u = $("#fUntil").value;
    return calWrite({type:"caladd", input:{title, date, note, repeat: rp, until: rp !== "never" && u ? u : "", opId: newOpId()}}, "Adding", "Added to your Bills calendar");
  }
  if (f.id === "affForm") {
    const p = S.affirm.plans.find(x => x.id === f.dataset.plan); if (!p) return;
    const amt = Math.abs(amtRaw), date = $("#fDate").value || serialToIso(todaySerial());
    if (!amt) { toast("Enter an amount"); return; }
    if (amt > p.balance + 0.005) { toast(`That's more than the ${money(p.balance)} balance`, 4000); return; }
    return submitOp({type:"affirmpay", planId: p.id, name: p.name, payment: p.payment, amt, serial: isoToSerial(date), date, note: $("#fNote").value.trim(),
      timeline: $("#fAffTl").checked && Math.abs(amt - p.payment) >= 0.005, removeLater: $("#fAffRm").checked && amt >= p.balance - 0.005, regular: Math.abs(amt - p.payment) < 0.005},
      "Recording payment", amt >= p.balance - 0.005 ? `${p.name} paid off 🎉` : `Recorded ${money(amt)}`);
  }
  if (f.id === "planForm") {
    lsSet(akey("cf_goal"), String(Math.max(0, parseMoney($("#fGoal").value))));
    lsSet(akey("cf_cushion"), String(Math.max(0, parseMoney($("#fCushion").value))));
    closeSheet(); render(); toast("Allowance updated"); return;
  }
  if (f.id === "setForm") {
    { const u = $("#fApi").value.trim(); if (u && !apiLinkOK(u)) { toast("That isn't an Apps Script web app link. It should start with https://script.google.com/ and end in /exec.", 6000); $("#fApi").focus(); return; } }
    lsSet(akey("cf_bank"), $("#fBank").value.trim());
    const rows = [...document.querySelectorAll(".acctrow")].map(r => {
      const name = r.querySelector(".aName").value.trim(), v = r.querySelector(".aLink").value.trim();
      const m = v.match(/\/d\/([a-zA-Z0-9_-]+)/); return {name, id: m ? m[1] : v};
    }).filter(a => a.name && a.id);
    if (rows.length) { saveAccounts(rows); if (!rows.some(a => a.id === S.id)) { switchAccount(rows[0].id); } else renderAcct(); }
    const url = $("#fApi").value.trim(), key = $("#fKey").value.trim();
    const changed = url !== CFG.url || key !== CFG.key;
    CFG.url = url; CFG.key = key; lsSet("cf_api", url); lsSet("cf_key", key);
    closeSheet();
    if (url && key) { if (!mcp) { mcp = {}; startLive(); } if (changed) { S.tabs = []; loadAll().then(() => { if (!S.err) toast("Connected"); }); } }
    else { mcp = null; render(); }
    return;
  }
  if (!amtRaw && f.id !== "rowForm") { toast("Enter an amount"); return; }
  if (f.id === "addForm") {
    const type = f.dataset.type, serial = isoToSerial($("#fDate").value);
    let text = $("#fText").value.trim(), note = $("#fNote") ? $("#fNote").value.trim() : "";
    const amt = Math.abs(amtRaw);
    const cleared = !!document.querySelector('#clrSeg button.on[data-clrset="1"]');
    if (type === "expense") return submitOp({type:"log", tab:"Spending Log", serial, text: text || "Expense", amt, cleared}, "Adding expense", `Added ${money(amt)}`);
    if (type === "savings") { const out = document.querySelector("#dir button.on").dataset.dir === "out";
      return submitOp({type:"log", tab:"Savings Log", serial, text: text || (out ? "from savings" : "moved to savings"), amt: out ? -amt : amt}, "Saving", out ? `Pulled ${money(amt)} from savings` : `Moved ${money(amt)} to savings`); }
    const rp = (type === "income" || type === "bill") ? addRepeat() : null;
    const cal = type === "bill" && $("#fToCal") && $("#fToCal").checked
      ? {title: calTitle(text || "Bill", amt), date: serialToIso(serial), note, repeat: rp ? rp.freq : "never", until: rp && rp.until ? serialToIso(rp.until) : (rp && rp.months !== "all" ? serialToIso(repeatDates(serial, rp.freq, rp.months).slice(-1)[0] || serial) : "")} : null;
    if (rp) {
      if (rp.months === "date" && !rp.until) { toast("Pick the last date"); return; }
      const dates = repeatDates(serial, rp.freq, rp.months, rp.until);
      if (!dates.length) { toast("That date isn't inside your month tabs"); return; }
      const kind = type, desc = text || (type === "income" ? "Extra income" : "Bill");
      const word = type === "income" ? (dates.length === 1 ? "income entry" : "income entries") : (dates.length === 1 ? "bill" : "bills");
      let rnote = note || {weekly:"Weekly", biweekly:"Every 2 weeks", monthly:"Monthly"}[rp.freq];
      if (rp.until) rnote += " · ends " + serialToUS(rp.until);   // the monthly job reads this and stops after that date
      return submitOp({type:"repeat", kind, desc, amt, note: rnote, dates, cleared, cal},
        `Adding ${dates.length} ${word}`, `Added ${dates.length} repeating ${word}`);
    }
    if (type === "income") return submitOp({type:"item", kind:"income", serial, desc: text || "Extra income", amt, note, cleared}, "Adding income", `Added +${money(amt)}`);
    if (type === "bill") return submitOp({type:"item", kind:"bill", serial, desc: text || "Bill", amt, note, cleared, cal}, "Adding bill", `Added ${money(amt)} bill`);
  }
  if (f.id === "rowForm") {
    const row = S.month.rows.find(x => x.r === +f.dataset.r), scope = f.querySelector("input[name=scope]:checked").value;
    const desc = $("#fText").value.trim() || row.desc, note = $("#fNote").value.trim();
    const newSerial = $("#fDate") && $("#fDate").value ? isoToSerial($("#fDate").value) : row.serial;
    const ks = document.querySelector("#kindSeg button.on"), newKind = ks ? ks.dataset.kindset : row.kind;
    return submitOp({type:"row", title:S.month.title, r:row.r, serial:row.serial, origDesc:row.desc, desc, amt:Math.abs(amtRaw), note, scope, newSerial, newKind: newKind !== row.kind ? newKind : undefined},
      newSerial !== row.serial ? (scope === "future" ? "Moving every later one" : "Moving") : (scope === "future" ? "Updating every later one" : "Saving"), "Saved");
  }
  if (f.id === "repForm") {
    const it = S.spend.items.find(i => i.r === +f.dataset.r); if (!it) return;
    if (S.rep.months === "date" && !S.rep.until) { toast("Pick the last date"); return; }

    if (!dates.length) { toast("No dates fall inside your month tabs"); return; }
